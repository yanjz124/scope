name: Build and Release DGScope

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create GitHub release'
        required: true
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1
    
    - name: Extract version from tag or input
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } elseif ("${{ github.ref }}" -match "refs/tags/v(.*)") {
          $version = $matches[1]
        } else {
          $version = "1.0.0"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG_NAME=v$version" >> $env:GITHUB_OUTPUT
        Write-Host "Building version: $version"
    
    - name: Restore NuGet packages
      run: nuget restore scope.sln
    
    - name: Build solution (Release)
      run: msbuild scope.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /v:minimal
    
    - name: Create Portable ZIP
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $zipFileName = "DGScope-Portable-v$version.zip"
        
        Write-Host "Creating portable ZIP package..."
        
        # Create output directory
        New-Item -ItemType Directory -Force -Path ".\release-output" | Out-Null
        
        # Create ZIP from Release build
        $zipPath = ".\release-output\$zipFileName"
        Compress-Archive -Path ".\build\Release\*" -DestinationPath $zipPath -CompressionLevel Optimal
        
        Write-Host "✓ Created: $zipPath"
        
        # Verify the ZIP was created
        if (Test-Path $zipPath) {
          $size = (Get-Item $zipPath).Length / 1MB
          Write-Host "ZIP file size: $([math]::Round($size, 2)) MB"
        }
    
    - name: Install WiX Toolset
      shell: pwsh
      run: |
        Write-Host "Downloading WiX Toolset..."
        Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe' -OutFile wix311.exe
        Write-Host "Installing WiX Toolset..."
        Start-Process -FilePath ".\wix311.exe" -ArgumentList "/install", "/quiet", "/norestart" -Wait
        Write-Host "✓ WiX Toolset installed"
    
    - name: Harvest files with WiX Heat
      shell: pwsh
      run: |
        Write-Host "Harvesting files with WiX Heat..."
        $env:Path += ";${env:WIX}bin"
        
        # Use Heat to harvest all files from build\Release
        & heat.exe dir "build\Release" `
          -cg HarvestedFiles `
          -gg -sfrag -srd -sreg `
          -dr INSTALLFOLDER `
          -var "var.SourceDir" `
          -out "DGScope.Installer\HarvestedFiles.wxs"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Heat.exe failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        
        Write-Host "✓ Files harvested successfully"
    
    - name: Build MSI installer
      shell: pwsh
      run: |
        Write-Host "Building MSI installer..."
        $env:Path += ";${env:WIX}bin"
        
        # Compile harvested files
        & candle.exe "DGScope.Installer\HarvestedFiles.wxs" `
          -dSourceDir="$PWD\build\Release" `
          -dProductVersion="${{ steps.version.outputs.VERSION }}" `
          -out "DGScope.Installer\obj\Release\"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Candle.exe failed on HarvestedFiles.wxs"
          exit $LASTEXITCODE
        }
        
        # Compile Product.wxs
        & candle.exe "DGScope.Installer\Product.wxs" `
          -dSourceDir="$PWD\build\Release" `
          -dProductVersion="${{ steps.version.outputs.VERSION }}" `
          -out "DGScope.Installer\obj\Release\"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Candle.exe failed on Product.wxs"
          exit $LASTEXITCODE
        }
        
        # Link everything together
        & light.exe "DGScope.Installer\obj\Release\Product.wixobj" `
          "DGScope.Installer\obj\Release\HarvestedFiles.wixobj" `
          -ext WixUIExtension `
          -out "DGScope.Installer\bin\Release\DGScope_Setup.msi" `
          -spdb
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Light.exe failed"
          exit $LASTEXITCODE
        }
        
        # Copy MSI to release output
        $msiFile = Get-ChildItem "DGScope.Installer\bin\Release\*.msi" | Select-Object -First 1
        if ($msiFile) {
          $newName = "DGScope-Setup-v${{ steps.version.outputs.VERSION }}.msi"
          Copy-Item $msiFile.FullName ".\release-output\$newName"
          Write-Host "✓ Created: $newName"
        } else {
          Write-Error "MSI file not found!"
          exit 1
        }
    
    - name: Install Inno Setup
      shell: pwsh
      run: |
        Write-Host "Installing Inno Setup..."
        choco install innosetup -y
        Write-Host "✓ Inno Setup installed"
    
    - name: Build Inno Setup EXE installer
      shell: pwsh
      run: |
        Write-Host "Building EXE installer..."
        $issContent = Get-Content ".\DGScope.iss" -Raw
        $issContent = $issContent -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"${{ steps.version.outputs.VERSION }}`""
        $issContent | Set-Content ".\DGScope_build.iss"
        
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\DGScope_build.iss"
        
        # Copy EXE to release output
        $exeFile = Get-ChildItem "installer-output\*.exe" | Select-Object -First 1
        if ($exeFile) {
          $newName = "DGScope-Setup-v${{ steps.version.outputs.VERSION }}.exe"
          Copy-Item $exeFile.FullName ".\release-output\$newName"
          Write-Host "✓ Created: $newName"
        }
    
    - name: List release files
      shell: pwsh
      run: |
        Write-Host ""
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "Release Files Created:" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        Get-ChildItem ".\release-output\" | ForEach-Object {
          $size = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  $($_.Name) ($size MB)" -ForegroundColor Green
        }
        Write-Host ""
    
    - name: Generate release notes
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $releaseNotes = @"
        # DGScope v$version
        
        ## Download Options
        
        ### 🚀 Recommended for Most Users
        **DGScope-Setup-v$version.exe** - Single-file installer (Inno Setup)
        - Simple installation wizard
        - Creates Start Menu and Desktop shortcuts
        - Automatic uninstaller
        
        ### 🏢 Enterprise/IT Deployment
        **DGScope-Setup-v$version.msi** - Windows Installer package
        - MSI format for enterprise deployment
        - Group Policy compatible
        - Windows Installer features
        
        ### 📦 Portable Version
        **DGScope-Portable-v$version.zip** - No installation required
        - Extract and run
        - Perfect for USB drives or temporary use
        - No system changes
        
        ## System Requirements
        - Windows 7 or later (64-bit recommended)
        - .NET Framework 4.7.2 or later
        - Approximately 50 MB disk space
        
        ## Installation
        1. Download your preferred installer/package
        2. Run the installer (or extract the ZIP)
        3. Launch DGScope from Start Menu or Desktop
        
        ---
        
        📝 For issues or questions, please visit the [Issues](../../issues) page.
        "@
        
        $releaseNotes | Out-File -FilePath ".\release-output\RELEASE_NOTES.md" -Encoding UTF8
        Write-Host "✓ Release notes generated"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DGScope-Release-v${{ steps.version.outputs.VERSION }}
        path: release-output/
        if-no-files-found: error
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.TAG_NAME }}
        name: DGScope v${{ steps.version.outputs.VERSION }}
        body_path: release-output/RELEASE_NOTES.md
        draft: false
        prerelease: false
        files: |
          release-output/*.exe
          release-output/*.msi
          release-output/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
