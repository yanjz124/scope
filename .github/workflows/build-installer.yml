name: Build and Release DGScope

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create GitHub release'
        required: true
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1
    
    - name: Extract version from tag or input
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } elseif ("${{ github.ref }}" -match "refs/tags/v(.*)") {
          $version = $matches[1]
        } else {
          $version = "1.0.0"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG_NAME=v$version" >> $env:GITHUB_OUTPUT
        Write-Host "Building version: $version"
    
    - name: Restore NuGet packages
      shell: pwsh
      run: |
        Write-Host "Restoring NuGet packages..."

        # Use nuget restore with explicit package directory
        Write-Host "Using nuget restore with -PackagesDirectory..."
        nuget restore scope.sln -PackagesDirectory packages -NonInteractive -Verbosity normal

        if ($LASTEXITCODE -ne 0) {
          Write-Error "NuGet restore failed with exit code: $LASTEXITCODE"
          exit $LASTEXITCODE
        }

        Write-Host ""
        Write-Host "Verifying packages were restored..."
        if (Test-Path ".\packages") {
          $packageCount = (Get-ChildItem ".\packages" -Directory -ErrorAction SilentlyContinue).Count
          Write-Host "Found $packageCount package directories in .\packages"

          # List all packages
          Write-Host ""
          Write-Host "All package folders:"
          Get-ChildItem ".\packages" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  - $($_.Name)" }

          # Check for critical packages (allow any version)
          $criticalFound = @{
            "SharpZipLib" = $false
            "Newtonsoft.Json" = $false
          }

          Get-ChildItem ".\packages" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $name = $_.Name
            if ($name -like "SharpZipLib*") { $criticalFound["SharpZipLib"] = $true }
            if ($name -like "Newtonsoft.Json*") { $criticalFound["Newtonsoft.Json"] = $true }
          }

          Write-Host ""
          Write-Host "Critical packages check:"
          foreach ($pkg in $criticalFound.Keys) {
            if ($criticalFound[$pkg]) {
              Write-Host "  ✓ $pkg found" -ForegroundColor Green
            } else {
              Write-Error "  ✗ $pkg - MISSING!"
              exit 1
            }
          }

          # Verify SharpZipLib DLL exists
          Write-Host ""
          Write-Host "Checking for SharpZipLib DLL..."
          $sharpZipDll = Get-ChildItem ".\packages" -Recurse -Filter "ICSharpCode.SharpZipLib.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sharpZipDll) {
            Write-Host "  ✓ Found: $($sharpZipDll.FullName)"
          } else {
            Write-Error "  ✗ ICSharpCode.SharpZipLib.dll not found in packages!"
          }

          # Show directory structure of SharpZipLib package
          Write-Host ""
          Write-Host "SharpZipLib package structure:"
          $sharpZipFolder = Get-ChildItem ".\packages" -Directory -Filter "SharpZipLib*" | Select-Object -First 1
          if ($sharpZipFolder) {
            Get-ChildItem $sharpZipFolder.FullName -Recurse -File | Select-Object -First 10 | ForEach-Object {
              $relativePath = $_.FullName.Replace($sharpZipFolder.FullName, "SharpZipLib")
              Write-Host "  $relativePath"
            }
          }
        } else {
          Write-Error "Packages folder not found!"
          exit 1
        }

    - name: Copy missing DLLs to NexradDecoder
      shell: pwsh
      run: |
        Write-Host "Checking if DLLs need to be copied to NexradDecoder..."

        # Find SharpZipLib DLL - prefer net45/net461 version over netstandard2.0
        # NexradDecoder targets .NET Framework 4.7.2, so we need .NET Framework compatible DLLs
        $sharpZipDll = $null

        # Try to find .NET Framework versions first (net45, net461, net46, net472, etc.)
        # SharpZipLib 1.3.3 has net45 folder which is compatible with .NET Framework 4.7.2
        $preferredPaths = @(
          "packages\SharpZipLib.1.3.3\lib\net45\ICSharpCode.SharpZipLib.dll",
          "packages\SharpZipLib*\lib\net45\ICSharpCode.SharpZipLib.dll",
          "packages\SharpZipLib*\lib\net461\ICSharpCode.SharpZipLib.dll",
          "packages\SharpZipLib*\lib\net46\ICSharpCode.SharpZipLib.dll",
          "packages\SharpZipLib*\lib\net472\ICSharpCode.SharpZipLib.dll",
          "packages\SharpZipLib*\lib\netstandard2.0\ICSharpCode.SharpZipLib.dll"
        )

        foreach ($path in $preferredPaths) {
          $found = Get-ChildItem $path -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            $sharpZipDll = $found
            Write-Host "  Found SharpZipLib at: $($found.FullName)"
            break
          }
        }

        if (-not $sharpZipDll) {
          # Last resort: find any ICSharpCode.SharpZipLib.dll
          $sharpZipDll = Get-ChildItem ".\packages" -Recurse -Filter "ICSharpCode.SharpZipLib.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        }

        if ($sharpZipDll) {
          $dest = ".\NexradDecoder\ICSharpCode.SharpZipLib.dll"
          Copy-Item $sharpZipDll.FullName $dest -Force
          Write-Host "  ✓ Copied ICSharpCode.SharpZipLib.dll from $($sharpZipDll.DirectoryName) to NexradDecoder"
        } else {
          Write-Error "Could not find ICSharpCode.SharpZipLib.dll to copy!"
          exit 1
        }

        Write-Host "Done!"

    - name: Build solution (Release)
      shell: pwsh
      run: |
        Write-Host "Building solution..."
        Write-Host ""

        # Build with detailed verbosity to see what's failing
        msbuild scope.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /v:detailed > build.log 2>&1
        $buildExitCode = $LASTEXITCODE

        if ($buildExitCode -ne 0) {
          Write-Host "Build failed with exit code: $buildExitCode"
          Write-Host ""
          Write-Host "===== BUILD LOG (Last 200 lines) ====="
          Get-Content build.log -Tail 200
          Write-Host ""
          Write-Host "===== ERRORS AND WARNINGS ====="
          Get-Content build.log | Select-String -Pattern "(error|warning)" | Select-Object -Last 50
          exit $buildExitCode
        }

        Write-Host "Build completed successfully!"
    
    - name: Copy receiver plugins into Release output
      shell: pwsh
      run: |
        $destination = ".\scope\bin\Release"
        if (-not (Test-Path $destination)) {
          New-Item -ItemType Directory -Path $destination | Out-Null
        }

        Write-Host "Copying receiver and decoder assemblies into $destination"

        $patterns = @(
          ".\DGScope.Receivers.*\bin\Release\**\*.dll",
          ".\NexradDecoder\bin\Release\**\*.dll"
        )

        foreach ($pattern in $patterns) {
          Get-ChildItem -Path $pattern -File -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object {
              $targetPath = Join-Path $destination $_.Name
              if (-not (Test-Path $targetPath)) {
                Copy-Item $_.FullName $destination -Force
                Write-Host "  ✓ Copied $($_.Name)"
              }
            }
        }

        # Fail early if we did not copy anything
        $copied = Get-ChildItem $destination -Filter "DGScope.*.dll" -File | Measure-Object
        if ($copied.Count -eq 0) {
          Write-Error "No receiver assemblies were copied."
          exit 1
        }

    - name: Create Portable ZIP
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $zipFileName = "DGScope-Portable-v$version.zip"
        
        Write-Host "Creating portable ZIP package..."
        
        # Create output directory
        New-Item -ItemType Directory -Force -Path ".\release-output" | Out-Null
        
        # Create ZIP from Release build (main exe is in scope\bin\Release)
        $zipPath = ".\release-output\$zipFileName"
        Compress-Archive -Path ".\scope\bin\Release\*" -DestinationPath $zipPath -CompressionLevel Optimal
        
        Write-Host "✓ Created: $zipPath"
        
        # Verify the ZIP was created
        if (Test-Path $zipPath) {
          $size = (Get-Item $zipPath).Length / 1MB
          Write-Host "ZIP file size: $([math]::Round($size, 2)) MB"
        }
    
    - name: Install WiX Toolset
      shell: pwsh
      run: |
        Write-Host "WiX Toolset installation skipped for now..."
        Write-Host "✓ Skipping MSI build (focus on EXE and ZIP)"
    
    - name: Harvest files with WiX Heat
      shell: pwsh
      run: |
        Write-Host "Skipping file harvesting (MSI build disabled)..."
    
    - name: Build MSI installer
      shell: pwsh
      run: |
        Write-Host "MSI build skipped - using EXE and ZIP installers"
    
    - name: Install Inno Setup
      shell: pwsh
      run: |
        Write-Host "Installing Inno Setup..."
        choco install innosetup -y
        Write-Host "✓ Inno Setup installed"
    
    - name: Build Inno Setup EXE installer
      shell: pwsh
      run: |
        Write-Host "Building EXE installer..."
        
        # Verify release-output directory exists
        if (-not (Test-Path ".\release-output")) {
          New-Item -ItemType Directory -Force -Path ".\release-output" | Out-Null
        }
        
        # Create the ISS file with version replacement
        $issContent = Get-Content ".\DGScope.iss" -Raw
        $version = "${{ steps.version.outputs.VERSION }}"
        
        # Extract numeric version (e.g., 0.0.1 from 0.0.1-alpha2)
        $numericVersion = $version -replace '-.*', ''
        # Ensure 4 components (e.g., 0.0.1.0)
        $versionParts = $numericVersion.Split('.')
        while ($versionParts.Count -lt 4) {
          $versionParts += '0'
        }
        $versionInfoVersion = $versionParts[0..3] -join '.'
        
        Write-Host "Version: $version"
        Write-Host "VersionInfoVersion: $versionInfoVersion"
        
        # Replace versions - use numeric version for VersionInfo fields
        $issContent = $issContent -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
        $issContent = $issContent -replace 'VersionInfoVersion=.*', "VersionInfoVersion=$versionInfoVersion"
        $issContent = $issContent -replace 'VersionInfoProductVersion=.*', "VersionInfoProductVersion=$versionInfoVersion"
        $issContent | Set-Content ".\DGScope_build.iss"
        
        Write-Host "Running ISCC.exe..."
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\DGScope_build.iss"
        $exitCode = $LASTEXITCODE
        
        if ($exitCode -ne 0) {
          Write-Error "ISCC.exe failed with exit code: $exitCode"
          Write-Host "Listing installer-output directory:"
          Get-ChildItem ".\installer-output\" -Force 2>/dev/null | ForEach-Object { Write-Host "  $_" }
          exit $exitCode
        }
        
        Write-Host "ISCC.exe completed successfully"
        
        # Verify output was created
        Write-Host "Listing installer-output directory:"
        $files = Get-ChildItem ".\installer-output\" -File -ErrorAction SilentlyContinue
        if ($files) {
          foreach ($file in $files) {
            Write-Host "  Found: $($file.Name)"
          }
        } else {
          Write-Error "No files found in installer-output directory!"
          exit 1
        }
        
        # Copy EXE to release output
        $exeFile = Get-ChildItem ".\installer-output\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($exeFile) {
          $newName = "DGScope-Setup-v$version.exe"
          Copy-Item $exeFile.FullName ".\release-output\$newName"
          Write-Host "✓ Created: $newName"
        } else {
          Write-Error "No EXE file found in installer-output directory!"
          exit 1
        }
    
    - name: List release files
      shell: pwsh
      run: |
        Write-Host ""
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "Release Files Created:" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        
        if (Test-Path ".\release-output\") {
          $files = Get-ChildItem ".\release-output\" -File
          if ($files.Count -gt 0) {
            foreach ($file in $files) {
              $size = [math]::Round($file.Length / 1MB, 2)
              Write-Host "  $($file.Name) ($size MB)" -ForegroundColor Green
            }
          } else {
            Write-Error "No files found in release-output directory!"
            exit 1
          }
        } else {
          Write-Error "release-output directory does not exist!"
          exit 1
        }
        Write-Host ""
    
    - name: Generate release notes
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $releaseNotes = @"
        # DGScope v$version
        
        ## Download Options
        
        ### 🚀 Recommended for Most Users
        **DGScope-Setup-v$version.exe** - Single-file installer (Inno Setup)
        - Simple installation wizard
        - Creates Start Menu and Desktop shortcuts
        - Automatic uninstaller
        
        ### 🏢 Enterprise/IT Deployment
        **DGScope-Setup-v$version.msi** - Windows Installer package
        - MSI format for enterprise deployment
        - Group Policy compatible
        - Windows Installer features
        
        ### 📦 Portable Version
        **DGScope-Portable-v$version.zip** - No installation required
        - Extract and run
        - Perfect for USB drives or temporary use
        - No system changes
        
        ## System Requirements
        - Windows 7 or later (64-bit recommended)
        - .NET Framework 4.7.2 or later
        - Approximately 50 MB disk space
        
        ## Installation
        1. Download your preferred installer/package
        2. Run the installer (or extract the ZIP)
        3. Launch DGScope from Start Menu or Desktop
        
        ---
        
        📝 For issues or questions, please visit the [Issues](../../issues) page.
        "@
        
        $releaseNotes | Out-File -FilePath ".\release-output\RELEASE_NOTES.md" -Encoding UTF8
        Write-Host "✓ Release notes generated"
    
    - name: Verify release files before upload
      shell: pwsh
      run: |
        Write-Host "Verifying all expected files exist..."
        $version = "${{ steps.version.outputs.VERSION }}"
        $expectedFiles = @(
          "DGScope-Setup-v$version.exe",
          "DGScope-Portable-v$version.zip",
          "RELEASE_NOTES.md"
        )
        
        $allExist = $true
        foreach ($file in $expectedFiles) {
          $path = ".\release-output\$file"
          if (Test-Path $path) {
            Write-Host "✓ Found: $file" -ForegroundColor Green
          } else {
            Write-Host "✗ Missing: $file" -ForegroundColor Red
            $allExist = $false
          }
        }
        
        if (-not $allExist) {
          Write-Error "Some expected files are missing!"
          exit 1
        }
        
        Write-Host "✓ All files verified" -ForegroundColor Green
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DGScope-Release-v${{ steps.version.outputs.VERSION }}
        path: release-output/
        if-no-files-found: error
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.TAG_NAME }}
        name: DGScope v${{ steps.version.outputs.VERSION }}
        body_path: release-output/RELEASE_NOTES.md
        draft: false
        prerelease: false
        files: |
          release-output/*.exe
          release-output/*.msi
          release-output/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
